name: Nightly

# Performance benchmarks and coverage are slower / informational, so they run on
# a schedule rather than on every push. Can also be triggered manually.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

jobs:
  perf-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Performance tests
        run: npm run test:perf

      - name: Coverage
        run: npm run coverage
