name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview && npm ci

      - name: Check generated files are up to date
        run: |
          npm run gen:formats
          npm run sync:grammars
          git diff --exit-code

      - name: Type-check extension and server
        run: npx tsc --noEmit

      - name: Type-check webview
        run: cd webview && npx tsc --noEmit

      - name: Webview unit tests
        run: cd webview && npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview && npm ci

      - name: Build
        run: npm run build

      # @vscode/test-electron launches a real VS Code; xvfb provides a display
      # on the headless runner.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

  package:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview && npm ci

      - name: Build
        run: npm run build

      - name: Package extension
        run: npx vsce package --no-dependencies
